name = "readerhelper-auth"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# These are top-level settings and MUST sit above [vars]: in TOML every key
# after a table header belongs to that table, so putting them lower down turned
# them into environment variables the Worker never reads, and preview URLs
# silently stayed on.
#
# The workers.dev URL is what the app calls, so it stays on. Preview URLs are
# off: each deployment would otherwise get its own extra hostname serving this
# same auth endpoint, and an auth endpoint wants the smallest surface it can
# have. Turn them back on only to test a version before promoting it.
workers_dev = true
preview_urls = false

# Public, non-secret configuration. The client SECRET is never here --
# set it with:  wrangler secret put GITHUB_CLIENT_SECRET
[vars]
# From your GitHub OAuth App (Settings -> Developer settings -> OAuth Apps).
GITHUB_CLIENT_ID = "Ov23lioOgyK8KJ3BM7hq"

# Comma-separated GitHub logins permitted to use this instance.
ALLOWED_LOGINS = "misteramazingyt"

# Comma-separated origins allowed to call this worker. Keep this tight:
# it is what stops another site from using your worker as a free OAuth backend.
ALLOWED_ORIGINS = "https://misteramazingyt.github.io,http://localhost:8000,http://127.0.0.1:8000"

# OPTIONAL, and a secret rather than a var:
#   wrangler secret put SERPAPI_KEY
# Adds Google Scholar to title searches. Without it the /scholar route answers
# 501 and the app falls back to its keyless sources (Crossref, OpenAlex, Google
# Books), which already cover indexed literature. Results are cached for a day
# because the free SerpAPI tier is only 100 searches a month.
